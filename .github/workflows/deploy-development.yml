name: Deploy Firebase development
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch: null
  pull_request:
    branches:
      - dev
      - main
permissions:
  contents: read
  actions: read
concurrency:
  group: development-deployment
  cancel-in-progress: false
jobs:
  scope:
    name: Classify documentation scope
    runs-on: windows-latest
    outputs:
      documentationOnly: ${{ steps.scope.outputs.documentationOnly }}
      ciIntroduction: ${{ steps.scope.outputs.ciIntroduction }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: scope
        run: node scripts/documentation-changes.mjs classify
  source:
    name: Resolve verified source
    if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.result == 'success' && needs.scope.outputs.documentationOnly != 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'main') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'))) }}
    runs-on: windows-latest
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      proof: ${{ steps.evidence.outputs.proof }}
      hostingArtifactId: ${{ steps.evidence.outputs.hostingArtifactId }}
      sourceRunId: ${{ steps.evidence.outputs.sourceRunId }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve source verification
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verification-evidence.mjs resolve-development
    needs:
      - scope
  rules:
    needs:
      - source
      - scope
    if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.result == 'success' && needs.scope.outputs.documentationOnly != 'true' && (always() && (github.event_name != 'push' || github.ref != 'refs/heads/main') && (needs.source.result == 'success' || needs.source.result == 'skipped') && needs.source.outputs.reuse != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main'))) }}
    uses: ./.github/workflows/verify-rules.yml
  application:
    name: Verify application gates
    needs:
      - source
      - scope
    if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.result == 'success' && needs.scope.outputs.documentationOnly != 'true' && (always() && (github.event_name != 'push' || github.ref != 'refs/heads/main') && (needs.source.result == 'success' || needs.source.result == 'skipped') && needs.source.outputs.reuse != 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main'))) }}
    runs-on: windows-latest
    outputs:
      proof: ${{ steps.evidence.outputs.proof }}
      artifactId: ${{ steps.hosting.outputs.artifact-id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Check feature PR admission
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verification-evidence.mjs check-pr
      - name: Install dependencies
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: npx --yes npm@11.19.1 ci
      - name: Check project governance
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: ./scripts/check-governance.ps1
      - name: Run domain tests
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: npm test
      - name: Type-check the application
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: npm run typecheck
      - name: Build the application
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: npm run build
      - name: Check Functions syntax
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: node scripts/check-functions-syntax.mjs
      - name: Check Emulator seed syntax
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: node --check scripts/seed-emulator.mjs
      - name: Publish application identity
        id: evidence
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: node scripts/verification-evidence.mjs publish-application
      - name: Check Hosting artifact
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        run: if (-not (Test-Path -LiteralPath '.output/public/index.html' -PathType Leaf)) { throw 'Hosting artifact index.html is missing.' }
      - name: Upload verified Hosting artifact
        if: ${{ needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.evidence.outputs.hostingName }}
          path: .output/public
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
        id: hosting
  verify:
    name: Verify development deployment
    outputs:
      hostingName: ${{ steps.evidence.outputs.hostingName }}
    needs:
      - rules
      - source
      - scope
      - application
      - ci-introduction
    if: ${{ always() && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: windows-latest
    steps:
      - name: Require verification or source evidence
        run: if ('${{ needs.scope.result }}' -ne 'success') { throw 'Change scope failed.' } elseif ('${{ needs.scope.outputs.documentationOnly }}' -ne 'true') { if ('${{ needs.source.outputs.reuse }}' -eq 'true') { if ('${{ needs.source.result }}' -ne 'success') { throw 'Dev evidence failed.' } } elseif ('${{ needs.rules.result }}' -ne 'success' -or '${{ needs.source.result }}' -notin @('skipped', 'success')) { throw 'Rules shards or Dev evidence failed.' } } if ('${{ needs.scope.outputs.documentationOnly }}' -eq 'true' -or '${{ needs.source.outputs.reuse }}' -eq 'true') { if ('${{ needs.application.result }}' -ne 'skipped' -or '${{ needs.rules.result }}' -ne 'skipped') { throw 'Unexpected verification producer execution.' } } elseif ('${{ needs.application.result }}' -ne 'success') { throw 'Application verification failed.' }
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (true) }}
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (true) }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (true) }}
      - uses: actions/download-artifact@v8
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true')) }}
        with:
          pattern: rules-${{ github.sha }}-${{ github.run_attempt }}-*
          path: tmp/rules-receipts
          merge-multiple: true
      - name: Run Firestore and Callable Emulator tests
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true')) }}
        env:
          RULES_TEST_RECEIPTS: tmp/rules-receipts
        run: npm run test:rules
      - name: Verify application results and Hosting artifact
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse != 'true')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_VERIFICATION_PROOF: ${{ needs.application.outputs.proof }}
          APPLICATION_HOSTING_ARTIFACT_ID: ${{ needs.application.outputs.artifactId }}
        run: node scripts/verification-evidence.mjs check-application
      - name: Record verified source evidence
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse == 'true')) }}
        env:
          VERIFICATION_REUSE_PROOF: ${{ needs.source.outputs.proof }}
        run: node scripts/verification-evidence.mjs report
      - name: Download source PR Hosting artifact
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse == 'true' && github.event_name != 'pull_request')) }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.source.outputs.hostingArtifactId }}
          run-id: ${{ needs.source.outputs.sourceRunId }}
          github-token: ${{ github.token }}
          path: .output/public
          digest-mismatch: error
      - name: Publish comprehensive verification evidence
        id: evidence
        run: node scripts/verification-evidence.mjs publish
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (true)) }}
      - name: Check Hosting artifact
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse == 'true' && github.event_name != 'pull_request')) }}
        run: if (-not (Test-Path -LiteralPath '.output/public/index.html' -PathType Leaf)) { throw 'Hosting artifact index.html is missing.' }
      - name: Upload verified Hosting artifact
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (needs.source.outputs.reuse == 'true' && github.event_name != 'pull_request')) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.evidence.outputs.hostingName }}
          path: .output/public
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Upload comprehensive verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: tmp/verification-evidence.json
          if-no-files-found: error
          retention-days: 30
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.outputs.documentationOnly != 'true' && (true)) }}
      - name: Check documentation governance
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.result == 'success' && needs.scope.outputs.documentationOnly == 'true') }}
        run: ./scripts/check-governance.ps1
      - name: Verify documentation scope and whitespace
        if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.result == 'success' && needs.scope.outputs.documentationOnly == 'true') }}
        run: node scripts/documentation-changes.mjs verify
      - name: Require CI introduction verification
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.ciIntroduction == 'true' }}
        run: if ('${{ needs.ci-introduction.result }}' -ne 'success') { throw 'CI introduction verification failed.' }
  deploy:
    name: Deploy to termite-warranty-dev
    needs:
      - verify
      - scope
    if: ${{ needs.scope.outputs.ciIntroduction != 'true' && (needs.scope.result == 'success' && needs.scope.outputs.documentationOnly != 'true' && (!cancelled() && needs.verify.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev' && vars.DEVELOPMENT_BRANCH_DEPLOY_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Download verified Hosting artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify.outputs.hostingName }}
          path: .output/public
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TERMITE_WARRANTY_DEV }}
      - name: Prepare explicit Dev deployment and preserve protection hold
        run: node scripts/development-deployment.mjs prepare
      - name: Deploy Firestore, Functions, and Hosting
        run: npx firebase deploy --config firebase.development.generated.json --project termite-warranty-dev --only firestore,functions,hosting --non-interactive
      - name: Verify deployed Dev release and protection hold
        run: node scripts/development-deployment.mjs check
  ci-introduction:
    name: Verify CI introduction
    needs: scope
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.ciIntroduction == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify CI introduction scope
        run: node scripts/documentation-changes.mjs verify-ci
      - name: Resolve CI introduction verification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-introduction.mjs
      - uses: actions/setup-java@v6
        if: ${{ steps.source.outputs.reuse != 'true' }}
        with:
          distribution: temurin
          java-version: "21"
      - name: Install CI dependencies
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: npx --yes npm@11.19.1 ci
      - name: Check project governance
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: ./scripts/check-governance.ps1
      - name: Run domain tests
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: npm test
      - name: Type-check the application
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: npm run typecheck
      - name: Build the application
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: npm run build
      - name: Run Firestore and Callable Emulator tests
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: npm run test:rules
      - name: Check Functions syntax
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: node scripts/check-functions-syntax.mjs
      - name: Check Emulator seed syntax
        if: ${{ steps.source.outputs.reuse != 'true' }}
        run: node --check scripts/seed-emulator.mjs
