name: Review integration
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Verify development deployment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./scripts/check-governance.ps1
      - run: git diff --check HEAD^1 HEAD
      - run: node scripts/pipeline.mjs scope
        env:
          GH_TOKEN: ${{ github.token }}
