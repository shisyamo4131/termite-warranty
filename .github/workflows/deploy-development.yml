name: Deploy Firebase development

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  rules:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    uses: ./.github/workflows/verify-rules.yml
  verify:
    name: Verify development deployment
    needs: rules
    if: ${{ always() && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
    runs-on: windows-latest
    steps:
      - name: Require every Rules shard to succeed
        run: if ('${{ needs.rules.result }}' -ne 'success') { throw 'Rules shards did not all succeed.' }
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check explicit Dev promotion acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verification-evidence.mjs check-pr

      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci

      - name: Check project governance
        run: ./scripts/check-governance.ps1

      - name: Run domain tests
        run: npm test

      - name: Type-check the application
        run: npm run typecheck

      - name: Build the application
        run: npm run build

      - uses: actions/download-artifact@v8
        with:
          pattern: rules-${{ github.sha }}-${{ github.run_attempt }}-*
          path: tmp/rules-receipts
          merge-multiple: true
      - name: Run Firestore and Callable Emulator tests
        env:
          RULES_TEST_RECEIPTS: tmp/rules-receipts
        run: npm run test:rules

      - name: Check Functions syntax
        run: node scripts/check-functions-syntax.mjs

      - name: Check Emulator seed syntax
        run: node --check scripts/seed-emulator.mjs

      - name: Check Hosting artifact
        run: if (-not (Test-Path -LiteralPath '.output/public/index.html' -PathType Leaf)) { throw 'Hosting artifact index.html is missing.' }

      - name: Upload verified Hosting artifact
        uses: actions/upload-artifact@v7
        with:
          name: firebase-hosting-${{ github.sha }}
          path: .output/public
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Publish comprehensive verification evidence
        id: evidence
        run: node scripts/verification-evidence.mjs publish
      - name: Upload comprehensive verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: tmp/verification-evidence.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to termite-warranty-dev
    needs: verify
    # Transition remains off until separately approved repository configuration.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.DEVELOPMENT_BRANCH_DEPLOY_ENABLED != 'true' && vars.PRODUCTION_APP_DEPLOY_ENABLED != 'true') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev' && vars.DEVELOPMENT_BRANCH_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci

      - name: Download verified Hosting artifact
        uses: actions/download-artifact@v8
        with:
          name: firebase-hosting-${{ github.sha }}
          path: .output/public

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TERMITE_WARRANTY_DEV }}

      - name: Deploy Firestore, Functions, and Hosting
        run: npx firebase deploy --project termite-warranty-dev --only firestore,functions,hosting --non-interactive
