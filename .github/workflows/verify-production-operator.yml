name: Verify production operator read-only access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: windows-latest
    environment: production-operations
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npx --yes npm@11.19.1 ci
      - run: node --test test/production-operator-probe.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: termite-warranty-prod
          workload_identity_provider: projects/988295873733/locations/global/workloadIdentityPools/github-production-operations/providers/github
          service_account: prod-operator@termite-warranty-prod.iam.gserviceaccount.com
          cleanup_credentials: true
      - run: node scripts/production-operator-probe.mjs --execute-approved
